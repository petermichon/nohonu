services:
  caddy:
    build:
      dockerfile: backend/Dockerfile.caddy
      context: ..
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      OVH_ENDPOINT: ${OVH_ENDPOINT}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: .
    environment:
      PORT: '8080'
      SITES_DIR: /data
      API_KEY: ${API_KEY:-}
    volumes:
      - data:/data
    networks:
      - app
    restart: unless-stopped

networks:
  app:

volumes:
  data:
  caddy_data:
  caddy_config:
