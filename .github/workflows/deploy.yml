name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/nohonu
            git pull --ff-only
            cd deploy
            ./backup.sh
            COMMIT_SHA=$(git -C /opt/nohonu rev-parse --short HEAD) docker compose up -d --build
            sleep 5
            PW=$(sed -n 's/^SERVER_PASSWORD=//p' /opt/nohonu/deploy/.env)
            curl -fsS -H "X-Server-Password: $PW" http://127.0.0.1:8081/health || exit 1
