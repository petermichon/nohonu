name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/nohonu
            git pull --ff-only
            cd deploy
            ./backup.sh
            COMMIT_SHA=$(git -C /opt/nohonu rev-parse --short HEAD) docker compose up -d --build
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8081/health; then
                echo "health check OK (attempt $i)"
                exit 0
              fi
              echo "health check attempt $i failed, retrying in 5s..."
              sleep 5
            done
            echo "::error::backend health check failed after retries"
            echo "===== backend logs ====="
            docker compose logs --tail=200 backend || true
            exit 1
