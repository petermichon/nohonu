services:
  caddy:
    build:
      dockerfile: deploy/Dockerfile.caddy
      context: ..
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      OVH_ENDPOINT: ${OVH_ENDPOINT}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      PORT: '8080'
      SITES_DIR: /data
      DATABASE_URL: file:/data/nohonu.db
      API_KEY: ${API_KEY:-}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
